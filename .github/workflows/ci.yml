name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      # Pinned tool versions from the dotnet-tools.json manifest (single source
      # of truth, same versions as local development). On .NET 10 SDKs this
      # makes `dotnet fantomas` / `dotnet fsharplint` resolvable without any
      # PATH changes.
      - name: Restore .NET tools (pinned manifest)
        run: dotnet tool restore

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install markdown toolchain
        run: |
          pip install mdformat mdformat-frontmatter
          pip install -e tools/mdformat_tasklog

      # CFPQ reference tests (FLPQ.CFPQ.Tests) read the gitignored data/cfpq/
      # directory; materialize it from the pinned flpq-data package before
      # running the test suite.
      - name: Export CFPQ reference data
        run: |
          pip install --extra-index-url https://test.pypi.org/simple/ "flpq-data==6.0.0.dev15"
          python3 tools/flpq_data/export.py

      - name: Markdown format check
        run: mdformat --check $(git ls-files '*.md')

      # The documentation map in docs/main.md is generated from per-page
      # metadata (Tags/Kind/Abstract); fail on drift or missing metadata.
      - name: Docs map check
        run: python3 tools/generate_doc_map.py --check

      - name: Format check
        run: dotnet fantomas . --check

      - name: Lint
        run: dotnet fsharplint lint FLPQ.slnx

      - name: Build
        run: dotnet build FLPQ.slnx -c Debug --no-restore

      # The runner image has neither Graphviz (`dot`) nor TeX Live
      # (`lualatex`): tool-dependent categories are excluded here (see
      # docs/developer/guides/test-categories.md). They run in the
      # graphviz-tests job below and locally via the hard gate.
      - name: Test (excluding Graphviz, TeX, Summary)
        run: dotnet test --no-build -c Debug --filter "Category!=Graphviz&Category!=TeX&Category!=Summary"

  graphviz-tests:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Restore
        run: dotnet restore

      - name: Restore .NET tools (pinned manifest)
        run: dotnet tool restore

      - name: Build
        run: dotnet build FLPQ.slnx -c Debug --no-restore

      # DOT-compilation tests only; TeX compilation stays local (no TeX Live
      # on the runner, and installing it is impractical).
      - name: Test (Graphviz only)
        run: dotnet test --no-build -c Debug --filter "Category=Graphviz"
