name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        config: [Debug, Release]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore packages
        run: dotnet restore

      - name: Check formatting
        run: dotnet fantomas . --check

      - name: Build
        run: dotnet build -c ${{ matrix.config }} --no-restore

      - name: Test (excluding Graphviz/TeX/Summary)
        run: dotnet test -c ${{ matrix.config }} --no-build --filter "Category!=Graphviz&Category!=TeX&Category!=Summary"

  graphviz-tests:
    needs: build-and-test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        config: [Debug, Release]

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore packages
        run: dotnet restore

      - name: Build
        run: dotnet build -c ${{ matrix.config }} --no-restore

      - name: Test (Graphviz only)
        run: dotnet test -c ${{ matrix.config }} --no-build --filter "Category=Graphviz"

  coverage-check:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore packages
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Collect coverage
        run: |
          mkdir -p coverage
          dotnet dotnet-coverage collect \
            dotnet test FLPQ.slnx \
              --filter "Category!=Graphviz&Category!=TeX&Category!=Summary" \
              --no-build \
              -v quiet \
            -o coverage/coverage.cobertura \
            -f cobertura \
            --nologo

      - name: Check coverage threshold
        run: |
          python3 - coverage/coverage.cobertura << 'PYEOF'
          import sys
          import xml.etree.ElementTree as ET

          tree = ET.parse(sys.argv[1])
          root = tree.getroot()

          source_packages = [
              "FLPQ.LinearAlgebra",
              "FLPQ.GraphAnalysis",
              "FLPQ.Languages",
              "FLPQ.Printers",
              "FLPQ.RPQ",
              "FLPQ.Cli",
          ]

          total_covered = 0
          total_valid = 0

          for pkg in root.findall(".//package"):
              name = pkg.attrib.get("name", "")
              if name not in source_packages:
                  continue
              for cls in pkg.findall(".//class"):
                  for line in cls.findall(".//lines/line"):
                      hits = int(line.attrib.get("hits", 0))
                      if hits > 0:
                          total_covered += 1
                      total_valid += 1

          total_rate = (total_covered / total_valid * 100) if total_valid > 0 else 0
          threshold = 80.0
          print(f"Line coverage: {total_rate:.1f}% (threshold: {threshold}%)")
          if total_rate < threshold:
              print(f"FAIL: Coverage {total_rate:.1f}% is below threshold {threshold}%")
              sys.exit(1)
          print("PASS: Coverage meets threshold")
          PYEOF
